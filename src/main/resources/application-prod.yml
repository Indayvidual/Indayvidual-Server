spring:
  profiles:
    active: prod
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PDB_URL}
    username: ${PDB_USER}
    password: ${PDB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100

server:
  port: 8080

logging:
  level:
    com.indayvidual: INFO
