auth:
  jwt:
    secret: ${JWT_SECRET}

spring:
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PDB_URL}
    username: ${PDB_USER}
    password: ${PDB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
  #aws
  cloud:
    aws:
      s3:
        bucket: ${BUCKET_NAME}
      region:
        static: ap-northeast-2
      stack:
        auto: false
      credentials:
        accessKey: ${AWS_ACCESS_KEY_ID}
        secretKey: ${AWS_SECRET_ACCESS_KEY}

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.indayvidual: INFO
